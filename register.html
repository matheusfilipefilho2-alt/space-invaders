<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="src/styles/wallet-ui.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Registro - Space Invaders</title>
</head>
<body>
    <!-- Wallet Connection -->
    <div class="header-wallet">
        <button id="wallet-connect-btn" class="wallet-btn">
            <span>🔗</span> Conectar Wallet
        </button>

        <div id="wallet-display" style="display: none;">
            <span class="wallet-icon">👛</span>
            <span id="wallet-address">...</span>
            <button id="wallet-disconnect-btn">❌</button>
        </div>
    </div>

    <!-- Canvas para fundo de estrelas animado -->
    <canvas id="stars-background"></canvas>

    <section class="start-screen">
        <div class="form-wrapper">
            <h1 class="game-title">🚀 REGISTRO</h1>
            <p class="game-subtitle">Crie sua conta para salvar pontuações</p>

            <!-- Invasor animado decorativo -->
            <div class="animated-invader">
                <div class="invader-container">
                    <div class="invader-sprite">👤</div>
                    <div class="invader-eyes"></div>
                </div>
                <div class="invader-beam"></div>
                <div class="invader-shadow"></div>
            </div>

            <!-- Formulário de registro -->
            <div class="form-container">
                <input
                    type="text"
                    id="new-username"
                    placeholder="Nome de usuário"
                    maxlength="20"
                    autocomplete="username"
                    class="game-input"
                />
                <input
                    type="tel"
                    id="new-pin"
                    placeholder="PIN (4 dígitos)"
                    maxlength="4"
                    pattern="[0-9]{4}"
                    inputmode="numeric"
                    autocomplete="new-password"
                    class="game-input"
                />
                <input
                    type="tel"
                    id="confirm-pin"
                    placeholder="Confirmar PIN"
                    maxlength="4"
                    pattern="[0-9]{4}"
                    inputmode="numeric"
                    autocomplete="new-password"
                    class="game-input"
                />
            </div>

            <!-- Botões de ação -->
            <div class="menu-buttons">
                <button class="button-play button-create">
                    <span class="button-icon">✨</span>
                    CRIAR CONTA
                </button>
                <button class="button-view-ranking button-back-register">
                    <span class="button-icon">←</span>
                    VOLTAR
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer-container">
            <div class="footer-line"></div>
            <span class="footer-text">DEVELOPED BY MATHEUSIN v1.9</span>
            <div class="footer-stars">
                <span>✦</span><span>✧</span><span>✦</span>
            </div>
        </div>
    </section>

    <!-- Bcrypt para hash de PIN -->
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
    <script type="module" src="src/register.js"></script>
    <script type="module">
        // Importar sistema global de música
        import globalMenuMusic from './src/globalMenuMusic.js';
    </script>
    
    <script type="module">
        // Importar a classe Star
        import Star from './src/classes/Star.js';

        class StarFieldBackground {
            constructor() {
                this.canvas = document.getElementById('stars-background');
                this.ctx = this.canvas.getContext('2d');
                this.stars = [];
                this.numberOfStars = 150; // Número de estrelas

                this.resize();
                this.init();
                this.animate();

                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;

                // Recriar estrelas quando redimensionar
                this.stars = [];
                this.init();
            }

            init() {
                for (let i = 0; i < this.numberOfStars; i++) {
                    const star = new Star(this.canvas.width, this.canvas.height);
                    this.stars.push(star);
                }
            }

            animate() {
                // Limpar completamente o canvas e redesenhar com cor sólida
                this.ctx.globalCompositeOperation = 'source-over';
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Usar cor sólida sem transparência
                this.ctx.fillStyle = '#050519';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Desenhar as estrelas
                this.stars.forEach(star => {
                    star.update();
                    star.draw(this.ctx);
                });

                requestAnimationFrame(() => this.animate());
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new StarFieldBackground();
        });
    </script>

    <!-- Solana Web3.js -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <!-- Metaplex Token Metadata -->
    <script src="https://unpkg.com/@metaplex-foundation/mpl-token-metadata@2/dist/index.umd.js"></script>

    <!-- SPL Token -->
    <script src="https://unpkg.com/@solana/spl-token@latest/lib/index.iife.js"></script>

</body>
</html>
