<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PvP Arena - Space Invaders</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="src/styles/pvp.css">
  <link rel="stylesheet" href="src/styles/wallet-ui.css" />
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Canvas para fundo de estrelas -->
  <canvas id="stars-background"></canvas>

  <!-- Wallet UI Container -->
  <div class="header-wallet" style="position: fixed; top: 10px; right: 10px; z-index: 1000;">
    <button id="wallet-connect-btn" class="wallet-btn">
      <span>🔗</span> CONECTAR WALLET
    </button>
    <div id="wallet-display" style="display: none;">
      <span class="wallet-icon">👛</span>
      <span id="wallet-address">...</span>
      <button id="wallet-disconnect-btn">❌</button>
    </div>
  </div>

  <div class="pvp-lobby">
    <header class="pvp-header">
      <div class="title-container">
        <h1 class="pvp-title">
          <span class="title-word" data-text="⚔️" style="font-size: 60px;">⚔️</span>
          <span class="title-word space-word" data-text="PVP ARENA">PVP ARENA</span>
        </h1>
        <div class="title-scanlines"></div>
        <div class="title-glow"></div>
      </div>
      <button id="back-btn" class="navbar-btn navbar-btn-home">
        <span class="navbar-icon">←</span>
        <span class="navbar-text">VOLTAR</span>
      </button>
    </header>

    <main class="pvp-main">
      <!-- Mode Selection -->
      <section class="mode-selection">
        <button id="quick-match-btn" class="mode-btn mode-btn-active">
          <span class="button-icon">🎯</span>
          PARTIDA RÁPIDA
        </button>
        <button id="challenge-friend-btn" class="mode-btn">
          <span class="button-icon">👥</span>
          DESAFIAR AMIGO
        </button>
      </section>

      <div class="pvp-content">
        <!-- Quick Match Section -->
        <section id="quick-match-section" class="pvp-section">
          <div class="bet-selector">
            <h3 class="section-title">ESCOLHA SUA APOSTA</h3>
            <div class="bet-options">
              <button class="bet-btn" data-bet="10">
                <span class="coin-icon">🪙</span>
                <span class="bet-amount">10</span>
                <span class="bet-label">MOEDAS</span>
              </button>
              <button class="bet-btn" data-bet="50">
                <span class="coin-icon">🪙</span>
                <span class="bet-amount">50</span>
                <span class="bet-label">MOEDAS</span>
              </button>
              <button class="bet-btn" data-bet="100">
                <span class="coin-icon">🪙</span>
                <span class="bet-amount">100</span>
                <span class="bet-label">MOEDAS</span>
              </button>
              <button class="bet-btn" data-bet="500">
                <span class="coin-icon">🪙</span>
                <span class="bet-amount">500</span>
                <span class="bet-label">MOEDAS</span>
              </button>
            </div>
          </div>

          <div id="queue-status" class="queue-status hidden">
            <div class="spinner"></div>
            <p class="queue-text">PROCURANDO OPONENTE...</p>
            <button id="cancel-queue-btn" class="btn-danger">CANCELAR</button>
          </div>
        </section>

        <!-- Challenge Friend Section -->
        <section id="challenge-section" class="pvp-section hidden">
          <div class="challenge-input">
            <h3 class="section-title">DESAFIAR JOGADOR</h3>
            <input type="text" id="friend-username" class="pvp-input" placeholder="NOME DO JOGADOR">
            <div class="bet-selector">
              <h4 class="section-subtitle">APOSTA</h4>
              <select id="challenge-bet" class="pvp-select">
                <option value="10">10 MOEDAS</option>
                <option value="50">50 MOEDAS</option>
                <option value="100">100 MOEDAS</option>
                <option value="500">500 MOEDAS</option>
              </select>
            </div>
            <button id="send-challenge-btn" class="btn-primary">
              <span class="button-icon">⚡</span>
              ENVIAR DESAFIO
            </button>
          </div>
        </section>

        <!-- Stats Sidebar -->
        <aside class="stats-sidebar">
          <div class="elo-card">
            <h3 class="card-title">🏆 RANKING ELO</h3>
            <div id="elo-display" class="elo-value">1000</div>
            <p class="elo-rank">INICIANTE</p>
          </div>

          <div class="match-history">
            <h3 class="card-title">📊 HISTÓRICO</h3>
            <div id="history-list" class="history-items">
              <p class="no-history">Nenhuma partida ainda</p>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <!-- Challenge Modal -->
  <div id="challenge-modal" class="modal hidden">
    <div class="modal-content">
      <h2 class="modal-title">⚔️ DESAFIO RECEBIDO!</h2>
      <p id="challenge-text" class="modal-text"></p>
      <div class="modal-actions">
        <button id="accept-challenge-btn" class="btn-success">
          <span class="button-icon">✓</span>
          ACEITAR
        </button>
        <button id="decline-challenge-btn" class="btn-danger">
          <span class="button-icon">✗</span>
          RECUSAR
        </button>
      </div>
    </div>
  </div>

  <!-- Game Canvas (hidden until match starts) -->
  <div id="game-container" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000;">
    <canvas id="game-canvas"></canvas>

    <!-- PvP Score UI -->
    <section class="score-ui pvp-score-ui">
      <!-- Player 1 Stats (You - Bottom) -->
      <div class="pvp-player-stats player-bottom">
        <div class="player-indicator">
          <span class="player-label">VOCÊ</span>
          <span class="player-icon">🚀</span>
        </div>
        <div class="game-stats">
          <div class="score-item">
            <span class="score-label">SCORE</span>
            <span class="score-value" id="pvp-score-local">0</span>
          </div>
          <div class="score-item">
            <span class="score-label">KILLS</span>
            <span class="score-value" id="pvp-kills-local">0</span>
          </div>
          <div class="score-item">
            <span class="score-label">LIVES</span>
            <span class="score-value" id="pvp-lives-local">3</span>
          </div>
        </div>
      </div>

      <!-- Center Info -->
      <div class="pvp-center-info">
        <div class="match-timer" id="pvp-timer">0:00</div>
        <div class="alien-count" id="pvp-aliens">
          <span class="alien-icon">👾</span>
          <span id="pvp-alien-count">0</span>
        </div>
      </div>

      <!-- Player 2 Stats (Enemy - Top) -->
      <div class="pvp-player-stats player-top">
        <div class="player-indicator">
          <span class="player-icon">🛸</span>
          <span class="player-label">INIMIGO</span>
        </div>
        <div class="game-stats">
          <div class="score-item">
            <span class="score-label">LIVES</span>
            <span class="score-value" id="pvp-lives-remote">3</span>
          </div>
          <div class="score-item">
            <span class="score-label">KILLS</span>
            <span class="score-value" id="pvp-kills-remote">0</span>
          </div>
          <div class="score-item">
            <span class="score-label">SCORE</span>
            <span class="score-value" id="pvp-score-remote">0</span>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Scripts -->
  <script type="module">
    // Importar a classe Star para o fundo animado
    import Star from "./src/classes/Star.js";

    class StarFieldBackground {
      constructor() {
        this.canvas = document.getElementById("stars-background");
        this.ctx = this.canvas.getContext("2d");
        this.stars = [];
        this.numberOfStars = 120;

        this.resize();
        this.init();
        this.animate();

        window.addEventListener("resize", () => this.resize());
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.stars = [];
        this.init();
      }

      init() {
        for (let i = 0; i < this.numberOfStars; i++) {
          const star = new Star(this.canvas.width, this.canvas.height);
          this.stars.push(star);
        }
      }

      animate() {
        this.ctx.globalCompositeOperation = "source-over";
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.fillStyle = "#050519";
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        this.stars.forEach((star) => {
          star.update();
          star.draw(this.ctx);
        });

        requestAnimationFrame(() => this.animate());
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      new StarFieldBackground();
    });
  </script>
  <script type="module" src="src/pvp/PvPLobby.js"></script>
</body>
</html>
