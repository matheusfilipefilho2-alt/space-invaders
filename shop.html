<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="src/styles/wallet-ui.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Loja - Space Invaders</title>

</head>
<body class="shop-page">
    <!-- Canvas para fundo de estrelas animado -->
    <canvas id="stars-background"></canvas>

    <!-- Wallet UI Container -->
    <div class="header-wallet" style="position: fixed; top: 10px; right: 10px; z-index: 1000;">
      <button id="wallet-connect-btn" class="wallet-btn">
        <span>🔗</span> CONECTAR WALLET
      </button>
      <div id="wallet-display" style="display: none;">
        <span class="wallet-icon">👛</span>
        <span id="wallet-address">...</span>
        <button id="wallet-disconnect-btn">❌</button>
      </div>
    </div>

    <div class="shop-container">
        <!-- Header da Loja -->
        <div class="shop-header">
            <h1 class="shop-title">🛍️ LOJA GALÁCTICA</h1>
            <div class="user-coins" id="user-coins">
                🪙 Carregando...
            </div>
        </div>

        <!-- Categorias -->
        <div class="shop-categories" id="categories">
            <!-- Categorias serão carregadas aqui -->
        </div>

        <!-- Ofertas Diárias -->
        <div class="daily-offers">
            <h2 class="section-title">⏰ OFERTAS DIÁRIAS</h2>
            <div class="items-grid" id="daily-offers-grid">
                <!-- Ofertas diárias serão carregadas aqui -->
            </div>
        </div>

        <!-- Todos os Itens -->
        <div class="all-items">
            <h2 class="section-title" id="current-section-title">🛍️ TODOS OS ITENS</h2>
            <div class="items-grid" id="items-grid">
                <div class="loading">Carregando itens...</div>
            </div>
        </div>

        <!-- Inventário do Usuario -->
        <div class="inventory-section">
            <h2 class="section-title">🎒 MEU INVENTÁRIO</h2>
            <div class="inventory-grid" id="inventory-grid">
                <div class="loading">Carregando inventário...</div>
            </div>
        </div>

        <!-- Botões de Navegação -->
        <div class="menu-buttons" style="margin-top: 40px;">
            <button class="button-play" onclick="goToGame()">
                <span class="button-icon">🚀</span>
                JOGAR AGORA
            </button>
            <button class="button-view-ranking" onclick="goToRanking()">
                <span class="button-icon">🏆</span>
                RANKING
            </button>
            <button class="button-restart" onclick="goHome()">
                <span class="button-icon">🏠</span>
                INÍCIO
            </button>
        </div>
    </div>

    <!-- Modal de Confirmação -->
    <div class="modal" id="purchase-modal">
        <div class="modal-content">
            <h3 id="modal-title">Confirmar Compra</h3>
            <p id="modal-message">Deseja comprar este item?</p>
            <div class="modal-buttons">
                <button class="modal-btn confirm" onclick="confirmPurchase()">COMPRAR</button>
                <button class="modal-btn cancel" onclick="closePurchaseModal()">CANCELAR</button>
            </div>
        </div>
    </div>

    <!-- Modal de Resultado -->
    <div class="modal" id="result-modal">
        <div class="modal-content">
            <h3 id="result-title">Resultado</h3>
            <p id="result-message">Mensagem do resultado</p>
            <div class="modal-buttons">
                <button class="modal-btn confirm" onclick="closeResultModal()">OK</button>
            </div>
        </div>
    </div>

    <script type="module" src="src/shop.js"></script>
    <script type="module">
        // Importar sistema global de música
        import globalMenuMusic from './src/globalMenuMusic.js';
    </script>
    
    <!-- Funções de navegação -->
    <script>
        function goToGame() {
            window.location.href = 'game.html';
        }
        
        function goToRanking() {
            window.location.href = 'ranking.html';
        }
        
        function goHome() {
            window.location.href = 'index.html';
        }
    </script>
    
    <!-- Script para animação de fundo -->
    <script type="module">
        import Star from './src/classes/Star.js';

        class StarFieldBackground {
            constructor() {
                this.canvas = document.getElementById('stars-background');
                this.ctx = this.canvas.getContext('2d');
                this.stars = [];
                this.numberOfStars = 120;

                this.resize();
                this.init();
                this.animate();

                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.stars = [];
                this.init();
            }

            init() {
                for (let i = 0; i < this.numberOfStars; i++) {
                    const star = new Star(this.canvas.width, this.canvas.height);
                    this.stars.push(star);
                }
            }

            animate() {
                this.ctx.globalCompositeOperation = 'source-over';
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.fillStyle = '#050519';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.stars.forEach(star => {
                    star.update();
                    star.draw(this.ctx);
                });

                requestAnimationFrame(() => this.animate());
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new StarFieldBackground();
        });
    </script>

    <!-- Solana Web3.js -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

    <!-- SPL Token -->
    <script src="https://unpkg.com/@solana/spl-token@latest/lib/index.iife.js"></script>

</body>
</html>
