<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="src/styles/wallet-ui.css" />
    <link rel="stylesheet" href="src/styles/token-bridge.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Token Bridge - Space Invaders</title>
</head>
<body>
    <!-- Fundo animado com estrelas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Wallet UI Container -->
    <div class="header-wallet" style="position: fixed; top: 10px; right: 10px; z-index: 1000;">
      <button id="wallet-connect-btn" class="wallet-btn">
        <span>🔗</span> CONECTAR WALLET
      </button>
      <div id="wallet-display" style="display: none;">
        <span class="wallet-icon">👛</span>
        <span id="wallet-address">...</span>
        <button id="wallet-disconnect-btn">❌</button>
      </div>
    </div>

    <section class="start-screen">
        <div class="game-container bridge-container">
            <h1 class="game-title">🌉 TOKEN BRIDGE</h1>
            <p class="game-subtitle">Converta moedas em tokens SPACE</p>

            <!-- Balance Display -->
            <div class="balance-display">
                <div class="balance-card">
                    <div class="balance-icon">🪙</div>
                    <div class="balance-info">
                        <div class="balance-label">Moedas no Jogo</div>
                        <div class="balance-amount" id="game-balance">0</div>
                    </div>
                </div>
                <div class="balance-separator">⇄</div>
                <div class="balance-card">
                    <div class="balance-icon">💎</div>
                    <div class="balance-info">
                        <div class="balance-label">Tokens SPACE</div>
                        <div class="balance-amount" id="token-balance">0</div>
                    </div>
                </div>
            </div>

            <!-- Bridge Form -->
            <div class="bridge-form">
                <!-- Direction Selector -->
                <div class="direction-selector">
                    <button class="direction-btn active" id="withdraw-btn" data-direction="withdraw">
                        <span class="direction-icon">🪙→💎</span>
                        <span class="direction-text">Sacar Tokens</span>
                    </button>
                    <button class="direction-btn" id="deposit-btn" data-direction="deposit">
                        <span class="direction-icon">💎→🪙</span>
                        <span class="direction-text">Depositar Moedas</span>
                    </button>
                </div>

                <!-- Amount Input -->
                <div class="amount-section">
                    <label class="amount-label">Quantidade</label>
                    <div class="amount-input-wrapper">
                        <input
                            type="number"
                            id="amount-input"
                            class="amount-input"
                            placeholder="Digite a quantidade"
                            min="10"
                            max="10000"
                            step="1"
                        />
                        <div class="quick-amounts">
                            <button class="quick-amount-btn" data-amount="50">50</button>
                            <button class="quick-amount-btn" data-amount="100">100</button>
                            <button class="quick-amount-btn" data-amount="500">500</button>
                            <button class="quick-amount-btn" data-amount="1000">1000</button>
                        </div>
                    </div>
                    <div class="amount-info">
                        <span class="info-text">Min: 10 | Max: 10,000</span>
                    </div>
                </div>

                <!-- Transaction Summary -->
                <div class="transaction-summary" id="transaction-summary" style="display: none;">
                    <div class="summary-row">
                        <span class="summary-label">Você enviará:</span>
                        <span class="summary-value" id="send-amount">0</span>
                    </div>
                    <div class="summary-divider"></div>
                    <div class="summary-row">
                        <span class="summary-label">Você receberá:</span>
                        <span class="summary-value" id="receive-amount">0</span>
                    </div>
                    <div class="summary-note" id="summary-note"></div>
                </div>

                <!-- Action Button -->
                <button class="bridge-action-btn" id="bridge-action-btn" disabled>
                    <span class="btn-text">Converter</span>
                </button>

                <!-- Status Message -->
                <div class="status-message" id="status-message" style="display: none;"></div>
            </div>

            <!-- Transaction History -->
            <div class="transaction-history">
                <h3 class="section-title">📜 Histórico de Transações</h3>
                <div class="history-list" id="history-list">
                    <div class="loading-history">Carregando histórico...</div>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="menu-buttons">
                <button class="button-play" onclick="NavigationHelper.navigateToGame()">
                    <span class="button-icon">🚀</span>
                    JOGAR AGORA
                </button>

                <button class="button-view-ranking" onclick="NavigationHelper.navigateToShop()">
                    <span class="button-icon">🛍️</span>
                    LOJA
                </button>

                <button class="button-view-ranking" onclick="NavigationHelper.navigateToRanking()">
                    <span class="button-icon">🏆</span>
                    RANKING
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer-container">
            <div class="footer-line"></div>
            <span class="footer-text">DEVELOPED BY MATHEUSIN v1.9</span>
            <div class="footer-stars">
                <span>✦</span><span>✧</span><span>✦</span>
            </div>
        </div>
    </section>

    <!-- Loading Modal -->
    <div id="loading-modal" class="modal" style="display: none;">
        <div class="modal-content loading-content">
            <div class="loading-spinner"></div>
            <h3 id="loading-title">Processando...</h3>
            <p id="loading-message">Aguarde enquanto processamos sua transação</p>
        </div>
    </div>

    <!-- Solana Web3.js -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <!-- SPL Token -->
    <script src="https://unpkg.com/@solana/spl-token@latest/lib/index.iife.js"></script>

    <script type="module" src="src/token-bridge.js"></script>
    <script type="module">
        // Importar sistema global de música
        import globalMenuMusic from './src/globalMenuMusic.js';
    </script>

    <!-- Script para animação de fundo -->
    <script>
        // Animação de fundo para a página do token bridge
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.zIndex = '-1';
        canvas.style.background = 'radial-gradient(circle at center, #1a1a2e 0%, #0f0f23 100%)';

        const stars = [];
        const shootingStars = [];

        // Estrelas normais
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2,
                speed: Math.random() * 0.2 + 0.1,
                opacity: Math.random() * 0.8 + 0.2
            });
        }

        // Estrelas cadentes ocasionais
        function createShootingStar() {
            if (Math.random() < 0.001) {
                shootingStars.push({
                    x: Math.random() * canvas.width,
                    y: 0,
                    speedX: (Math.random() - 0.5) * 2,
                    speedY: Math.random() * 3 + 2,
                    length: Math.random() * 50 + 20,
                    opacity: 1
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar estrelas normais
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.fill();

                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = -star.radius;
                    star.x = Math.random() * canvas.width;
                }
            });

            // Criar estrelas cadentes
            createShootingStar();

            // Desenhar estrelas cadentes
            shootingStars.forEach((star, index) => {
                ctx.beginPath();
                ctx.moveTo(star.x, star.y);
                ctx.lineTo(star.x - star.speedX * 5, star.y - star.speedY * 3);
                ctx.strokeStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.lineWidth = 2;
                ctx.stroke();

                star.x += star.speedX;
                star.y += star.speedY;
                star.opacity -= 0.01;

                if (star.opacity <= 0 || star.y > canvas.height) {
                    shootingStars.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
