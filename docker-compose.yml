x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: dev/docker/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgres://spaceinvaders:dev_password_change_in_prod@postgres:5432/spaceinvaders?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://spaceinvaders:dev_password_change_in_prod@rabbitmq:5672/
    ports:
      - "${API_PORT:-8080}:80"
      - "40000:40000" # debug port
    working_dir: /app
    volumes:
      - "./backend:/app"
      - "./backend/.env:/app/.env:ro"
      - "go_mod_cache:/go/pkg/mod"
      - "go_build_cache_app:/go/cache"
    command:
      - "cmd/http/main.go"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spaceinvaders
      POSTGRES_PASSWORD: dev_password_change_in_prod
      POSTGRES_DB: spaceinvaders
    ports:
      - "5429:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaceinvaders"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # Redis Insight (optional UI for Redis)
  redisinsight:
    image: redislabs/redisinsight:latest
    ports:
      - "16379:8001"
    volumes:
      - redisinsight_data:/db
    depends_on:
      - redis
    logging: *default-logging

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: spaceinvaders
      RABBITMQ_DEFAULT_PASS: dev_password_change_in_prod
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - "./backend/dev/rabbitmq-plugins:/etc/rabbitmq/enabled_plugins"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:
  rabbitmq_data:
  go_mod_cache:
    name: "space_invaders_go_mod_cache"
  go_build_cache_app:
    name: "space_invaders_go_build_cache_app"
