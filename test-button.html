<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Component Test</title>
    <link rel="stylesheet" href="src/styles/design-system.css">
    <link rel="stylesheet" href="src/styles/animations.css">
    <link rel="stylesheet" href="src/styles/components.css">
    <style>
        body {
            background: #050519;
            padding: 40px;
            color: #fff;
        }
        .test-container {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }
        .test-title {
            font-family: "Press Start 2P", monospace;
            font-size: 12px;
            margin-bottom: 20px;
            color: #FFD700;
        }
        .button-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1 style="font-family: 'Press Start 2P', monospace; color: #FFD700;">Button Component Test</h1>

    <div class="test-container">
        <div class="test-title">Primary Variants</div>
        <div class="button-row" id="primary-test"></div>
    </div>

    <div class="test-container">
        <div class="test-title">Secondary Variants</div>
        <div class="button-row" id="secondary-test"></div>
    </div>

    <div class="test-container">
        <div class="test-title">Danger Variants</div>
        <div class="button-row" id="danger-test"></div>
    </div>

    <div class="test-container">
        <div class="test-title">Success Variants</div>
        <div class="button-row" id="success-test"></div>
    </div>

    <div class="test-container">
        <div class="test-title">Size Variants</div>
        <div class="button-row" id="size-test"></div>
    </div>

    <div class="test-container">
        <div class="test-title">States Test</div>
        <div class="button-row" id="states-test"></div>
    </div>

    <div class="test-container">
        <div class="test-title">Loading Test (Click me!)</div>
        <div class="button-row" id="loading-test"></div>
    </div>

    <script type="module">
        import UIButton from './src/components/ui/Button.js';

        console.log('=== Button Component Test Started ===');

        // Primary Variants
        const primaryContainer = document.getElementById('primary-test');
        const primaryBtn = new UIButton({
            text: 'Primary Button',
            variant: 'primary',
            onClick: () => console.log('Primary clicked')
        });
        primaryContainer.appendChild(primaryBtn.render());

        // Secondary Variants
        const secondaryContainer = document.getElementById('secondary-test');
        const secondaryBtn = new UIButton({
            text: 'Secondary Button',
            variant: 'secondary',
            onClick: () => console.log('Secondary clicked')
        });
        secondaryContainer.appendChild(secondaryBtn.render());

        // Danger Variants
        const dangerContainer = document.getElementById('danger-test');
        const dangerBtn = new UIButton({
            text: 'Danger Button',
            variant: 'danger',
            onClick: () => console.log('Danger clicked')
        });
        dangerContainer.appendChild(dangerBtn.render());

        // Success Variants
        const successContainer = document.getElementById('success-test');
        const successBtn = new UIButton({
            text: 'Success Button',
            variant: 'success',
            onClick: () => console.log('Success clicked')
        });
        successContainer.appendChild(successBtn.render());

        // Size Variants
        const sizeContainer = document.getElementById('size-test');

        const smallBtn = new UIButton({
            text: 'Small',
            size: 'sm',
            variant: 'primary',
            onClick: () => console.log('Small clicked')
        });
        sizeContainer.appendChild(smallBtn.render());

        const mediumBtn = new UIButton({
            text: 'Medium',
            size: 'md',
            variant: 'secondary',
            onClick: () => console.log('Medium clicked')
        });
        sizeContainer.appendChild(mediumBtn.render());

        const largeBtn = new UIButton({
            text: 'Large',
            size: 'lg',
            variant: 'success',
            onClick: () => console.log('Large clicked')
        });
        sizeContainer.appendChild(largeBtn.render());

        // States Test
        const statesContainer = document.getElementById('states-test');

        const disabledBtn = new UIButton({
            text: 'Disabled',
            variant: 'danger',
            disabled: true
        });
        statesContainer.appendChild(disabledBtn.render());

        const normalBtn = new UIButton({
            text: 'Normal State',
            variant: 'primary',
            onClick: () => console.log('Normal state clicked')
        });
        statesContainer.appendChild(normalBtn.render());

        // Loading Test
        const loadingContainer = document.getElementById('loading-test');
        const loadingBtn = new UIButton({
            text: 'Click to Load',
            variant: 'primary',
            onClick: () => {
                console.log('Loading started');
                loadingBtn.setLoading(true);
                setTimeout(() => {
                    console.log('Loading finished');
                    loadingBtn.setLoading(false);
                }, 2000);
            }
        });
        loadingContainer.appendChild(loadingBtn.render());

        console.log('=== All buttons rendered successfully ===');
        console.log('Tests to verify:');
        console.log('1. All buttons render with correct colors and styles');
        console.log('2. Hover effects work (except disabled)');
        console.log('3. Click handlers fire and show in console');
        console.log('4. Loading button shows spinner for 2 seconds on click');
        console.log('5. Disabled button cannot be clicked');
    </script>
</body>
</html>
