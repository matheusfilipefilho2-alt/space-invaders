services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: space-invaders-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spaceinvaders
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_change_in_prod}
      POSTGRES_DB: spaceinvaders
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaceinvaders"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - space-invaders-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: space-invaders-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - space-invaders-network

  # Space Invaders Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: space-invaders-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # Database
      DATABASE_URL: postgres://spaceinvaders:${DB_PASSWORD:-dev_password_change_in_prod}@postgres:5432/spaceinvaders?sslmode=disable

      # Redis
      REDIS_URL: redis://redis:6379

      # Server
      PORT: 8080
      GIN_MODE: ${GIN_MODE:-release}
      JWT_SECRET: ${JWT_SECRET}

      # Solana
      SOLANA_NETWORK: ${SOLANA_NETWORK:-devnet}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      SOLANA_TREASURY_PRIVATE_KEY: ${SOLANA_TREASURY_PRIVATE_KEY}
      SOLANA_SPACE_MINT: ${SOLANA_SPACE_MINT}
      TREASURY_WALLET_PUBKEY: ${TREASURY_WALLET_PUBKEY}

      # AbacatePay
      ABACATEPAY_API_KEY: ${ABACATEPAY_API_KEY}
      ABACATEPAY_BASE_URL: ${ABACATEPAY_BASE_URL:-https://api.abacatepay.com/v1}
      ABACATEPAY_WEBHOOK_SECRET: ${ABACATEPAY_WEBHOOK_SECRET}

      # Pinata (IPFS)
      PINATA_API_KEY: ${PINATA_API_KEY}
      PINATA_SECRET_KEY: ${PINATA_SECRET_KEY}

      # Treasury
      CONVERSION_RATIO: ${CONVERSION_RATIO:-100}
      REVENUE_SHARE_PERCENT: ${REVENUE_SHARE_PERCENT:-0.30}

      # Workers
      CONVERSION_WORKER_ENABLED: ${CONVERSION_WORKER_ENABLED:-true}
      EMISSION_CRON_ENABLED: ${EMISSION_CRON_ENABLED:-true}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}

      # Rate Limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}

      # Metrics
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PORT: 9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - space-invaders-network

  # Prometheus (optional - for metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: space-invaders-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - space-invaders-network
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  space-invaders-network:
    driver: bridge
