version: "2"
run:
  go: "1.27"
  modules-download-mode: readonly
  tests: false
linters:
  default: all
  disable:
    - depguard
    - prealloc
    - wsl
    - wsl_v5           # Whitespace muito rigoroso
    - exhaustruct      # Structs não precisam inicializar todos campos
    - exhaustruct_v5   # Versão 5 do exhaustruct
    - mnd              # Magic numbers são ok em contexto
    - godox            # TODOs são permitidos
    - varnamelen       # Nomes curtos são ok (i, j, db, etc)
    - nilerr           # Muito rigoroso para error handling
    - nlreturn         # Newline antes de return muito rigoroso
    - wrapcheck        # Error wrapping muito rigoroso
    - ireturn          # Interface returns são ok
    - tagliatelle      # Tag naming muito rigoroso
    - gochecknoglobals # Globais são ok em alguns casos
    - forbidigo        # Permite fmt.Println para debug
    - funlen           # Funções longas são ok às vezes
    - cyclop           # Complexidade ciclomática muito rigorosa
    - nestif           # Nesting muito rigoroso
    - gocognit         # Complexidade cognitiva muito rigorosa
    - tagalign         # Alinhamento de tags muito rigoroso
    - lll              # Line length muito rigoroso
    - err113           # Error wrapping muito rigoroso
    - godot            # Comentários com ponto final muito rigoroso
    - nonamedreturns   # Named returns são úteis
    - noinlineerr      # Inline errors são ok
    - modernize        # Modernização muito rigorosa
    - perfsprint       # Performance de sprint muito rigoroso
    - embeddedstructfieldcheck # Embedded structs são ok
  settings:
    wrapcheck:
      ignore-package-globs:
        - encoding/*
        - github.com/pkg/*
      ignore-sigs:
        - "(github.com/labstack/echo/v4.Context).NoContent"
        - "(github.com/labstack/echo/v4.Context).Blob"
        - "(github.com/labstack/echo/v4.Context).JSON"
        - "(github.com/labstack/echo/v4.Context).String"
        - "(github.com/labstack/echo/v4.Context).File"
    revive:
      rules:
        - name: if-return
          disabled: true
    tagliatelle:
      case:
        rules:
          json: snake
        use-field-name: true
    varnamelen:
      ignore-names:
        - wa
        - ev
        - id
        - jid
        - db
        - sl
        - sllinters
        - i
        - ok
      ignore-decls:
        - c echo.Context
        - tx *gorm.DB
        - db *gorm.DB
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - funlen
        path: translator.go
      - linters:
          - dupl
        path: internal/domain/model
      - linters:
          - exhaustruct
          - dupl
        path: internal/domain/repository
      - linters:
          - exhaustruct
          - dupl
          - forcetypeassert
        path: internal/api/http/controller
      - linters:
          - dupl
        path: internal/app/command
      - linters:
          - tagliatelle
        path: contract.go
      - linters:
          - wrapcheck
        path: internal/app/erp/bling/translator.go
      - linters:
          - wrapcheck
        path: internal/app/erp/bling/client.go
    paths:
      - docs/swagger
      - pkg/core
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - docs/swagger
      - pkg/core
      - third_party$
      - builtin$
      - examples$